<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Antrenman"/>
  <meta name="theme-color" content="#C8956C"/>
  <title>Antrenman Takip</title>
  <style>
    :root {
      --bg:#F5F0E8; --card:#FFFDF8; --card-done:#FFF8EE;
      --cream:#EDE8DC; --brown:#6B4F3A; --brown-light:#A07850;
      --brown-pale:#D4B896; --accent:#C8956C; --accent-dark:#A0714A;
      --accent-glow:rgba(200,149,108,0.18);
      --text:#3A2A1E; --text-soft:#9C7E68; --text-muted:#C4A882;
      --border:#E8DDD0; --border-done:#D4A87A;
      --st: env(safe-area-inset-top,0px);
      --sb: env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none;}
    #app{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:-webkit-fill-available;padding:calc(var(--st) + 76px) 24px calc(var(--sb) + 36px);position:relative;overflow:hidden;}
    .blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
    .blob1{top:-80px;right:-80px;width:280px;height:280px;background:rgba(200,149,108,0.07);}
    .blob2{bottom:-60px;left:-60px;width:220px;height:220px;background:rgba(160,120,80,0.06);}
    #topbar{position:fixed;top:var(--st);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;z-index:10;}
    #streak-badge{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--border-done);border-radius:50px;padding:8px 16px;box-shadow:0 4px 16px var(--accent-glow);font-size:13px;font-weight:700;color:var(--brown);transition:opacity 0.3s;}
    #streak-badge.hidden{opacity:0;pointer-events:none;}
    #cal-btn{background:var(--card);border:1.5px solid var(--border);border-radius:14px;width:46px;height:46px;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(58,42,30,0.07);display:flex;align-items:center;justify-content:center;transition:transform 0.15s;}
    #cal-btn:active{transform:scale(0.92);}
    #main-card{background:var(--card);border-radius:36px;padding:44px 36px 36px;width:min(88vw,360px);text-align:center;box-shadow:0 8px 40px rgba(58,42,30,0.08);border:1.5px solid var(--border);transition:all 0.5s cubic-bezier(0.34,1.2,0.64,1);position:relative;z-index:1;}
    #main-card.done{background:var(--card-done);box-shadow:0 12px 50px var(--accent-glow),0 2px 8px rgba(58,42,30,0.06);border-color:var(--border-done);}
    .day-label{font-size:11px;letter-spacing:2.5px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:4px;}
    .date-text{font-size:20px;font-weight:700;color:var(--text);margin-bottom:36px;}
    #star-btn{width:148px;height:148px;border-radius:50%;border:none;background:radial-gradient(circle,var(--cream) 0%,var(--bg) 100%);cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 4px 20px rgba(58,42,30,0.08),inset 0 2px 6px rgba(255,255,255,0.9);transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);outline:none;-webkit-appearance:none;}
    #star-btn.done{background:radial-gradient(circle,#FFF4E6 0%,#FFE8C8 100%);box-shadow:0 0 0 10px rgba(200,149,108,0.10),0 8px 32px rgba(200,149,108,0.25),inset 0 2px 8px rgba(255,255,255,0.8);}
    #star-btn:active{transform:scale(0.88);}
    #star-btn svg{transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);}
    #star-btn.pop svg{transform:rotate(20deg) scale(1.15);}
    .status-text{font-size:13px;color:var(--text-muted);font-style:italic;transition:all 0.3s;min-height:24px;}
    .status-text.done{font-size:15px;color:var(--accent-dark);font-weight:600;margin-bottom:18px;}
    #undo-btn{background:none;border:1px solid var(--border);border-radius:20px;color:var(--text-muted);font-size:11px;cursor:pointer;padding:5px 14px;font-family:inherit;display:none;margin-top:4px;}
    #undo-btn.visible{display:inline-block;}
    #week-bar{display:flex;gap:7px;margin-top:22px;position:relative;z-index:1;}
    .day-cell{width:38px;height:48px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all 0.3s;}
    .day-cell.done{background:#FFF0E0;border-color:var(--border-done);box-shadow:0 2px 12px var(--accent-glow);}
    .day-cell.today{border-color:var(--accent);}
    .dc-label{font-size:7.5px;color:var(--text-muted);font-weight:700;}
    .dc-val{font-size:10px;color:var(--text-muted);}
    #total-count{margin-top:16px;font-size:12px;color:var(--text-muted);min-height:18px;position:relative;z-index:1;}
    #total-count strong{color:var(--brown-light);}

    /* Notif banner */
    #notif-banner{position:fixed;bottom:calc(var(--sb) + 16px);left:50%;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--border);border-radius:24px;padding:18px 20px 16px;width:min(88vw,340px);box-shadow:0 8px 32px rgba(58,42,30,0.12);z-index:20;display:none;}
    #notif-banner.show{display:block;animation:slideUp 0.4s cubic-bezier(0.34,1.2,0.64,1);}
    #notif-banner p{font-size:13px;color:var(--text-soft);margin-bottom:12px;line-height:1.6;}
    .notif-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
    .notif-row label{font-size:12px;color:var(--text-soft);}
    .notif-row input[type=time]{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);outline:none;}
    #notif-allow-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:14px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
    #notif-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;}

    /* Calendar */
    #cal-overlay{position:fixed;inset:0;background:rgba(58,42,30,0.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;}
    #cal-overlay.open{display:flex;animation:fadeIn 0.25s ease;}
    #cal-modal{background:var(--card);border-radius:32px;padding:24px 18px;width:min(94vw,580px);max-height:88vh;overflow-y:auto;box-shadow:0 32px 80px rgba(58,42,30,0.18);border:1.5px solid var(--border);animation:slideDown 0.35s cubic-bezier(0.34,1.2,0.64,1);}
    .cal-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .cal-nav{background:none;border:1px solid var(--border);border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--brown);display:flex;align-items:center;justify-content:center;font-family:inherit;}
    .cal-year-title{flex:1;text-align:center;font-size:20px;font-weight:800;color:var(--text);}
    .cal-legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:16px;font-size:12px;color:var(--text-soft);}
    .year-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .month-mini{background:var(--bg);border-radius:14px;padding:10px 8px;border:1px solid var(--border);}
    .month-mini-title{font-size:9px;font-weight:800;letter-spacing:1.8px;color:var(--brown-pale);margin-bottom:6px;text-transform:uppercase;}
    .mmg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
    .mmh{font-size:7px;color:var(--text-muted);text-align:center;padding-bottom:2px;font-weight:600;}
    .mmc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:8px;color:var(--text-muted);}
    .mmc.done{background:#FFF0E0;border:1px solid var(--border-done);color:var(--accent);font-size:9px;}
    .mmc.today{border:1.5px solid var(--accent);font-weight:800;}

    /* Install hint */
    #install-hint{position:fixed;bottom:calc(var(--sb) + 16px);left:50%;transform:translateX(-50%);background:var(--brown);color:#FFF8EE;border-radius:18px;padding:14px 20px;font-size:12.5px;text-align:center;width:min(88vw,320px);z-index:15;line-height:1.7;box-shadow:0 8px 32px rgba(58,42,30,0.2);display:none;}
    #install-hint.show{display:block;animation:slideUp 0.4s cubic-bezier(0.34,1.2,0.64,1);}
    #install-hint button{background:none;border:none;color:var(--brown-pale);position:absolute;top:8px;right:12px;cursor:pointer;font-size:16px;}

    @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div id="app">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div id="topbar">
    <div id="streak-badge" class="hidden"><span>🔥</span><span id="streak-text">0 gün seri</span></div>
    <button id="cal-btn" onclick="openCal()">📅</button>
  </div>

  <div id="main-card">
    <div class="day-label" id="day-name"></div>
    <div class="date-text" id="date-text"></div>
    <button id="star-btn" onclick="toggleToday()">
      <svg id="star-svg" width="60" height="60" viewBox="0 0 48 48" fill="none">
        <polygon id="star-poly" points="24,4 29.5,18.5 45,18.5 32.5,28 37,43 24,34 11,43 15.5,28 3,18.5 18.5,18.5"
          fill="none" stroke="#D4B896" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="status-text" id="status-text">Bugün antrenman yaptın mı?</div>
    <button id="undo-btn" onclick="toggleToday()">↩ Geri al</button>
  </div>

  <div id="week-bar"></div>
  <div id="total-count"></div>
</div>

<div id="notif-banner">
  <button id="notif-close" onclick="document.getElementById('notif-banner').classList.remove('show')">✕</button>
  <p>Seni her gün hatırlatayım mı? 💌<br><small>Bildirim saatini seç:</small></p>
  <div class="notif-row">
    <label>Saat:</label>
    <input type="time" id="notif-time" value="09:00"/>
  </div>
  <button id="notif-allow-btn" onclick="requestNotif()">🔔 Bildirimleri Aç</button>
</div>

<div id="install-hint">
  📲 <strong>Ana ekrana eklemek için:</strong><br>Safari'de Paylaş ↑ → "Ana Ekrana Ekle"
  <button onclick="document.getElementById('install-hint').classList.remove('show')">✕</button>
</div>

<div id="cal-overlay" onclick="if(event.target===this)closeCal()">
  <div id="cal-modal">
    <div class="cal-header">
      <button class="cal-nav" onclick="chYear(-1)">‹</button>
      <div class="cal-year-title" id="cal-yr"></div>
      <button class="cal-nav" onclick="chYear(1)">›</button>
      <button class="cal-nav" onclick="closeCal()" style="margin-left:8px;color:#C4A882">✕</button>
    </div>
    <div class="cal-legend">
      <svg width="13" height="13" viewBox="0 0 48 48"><polygon points="24,4 29.5,18.5 45,18.5 32.5,28 37,43 24,34 11,43 15.5,28 3,18.5 18.5,18.5" fill="#C8956C"/></svg>
      Antrenman yapıldı
    </div>
    <div class="year-grid" id="year-grid"></div>
  </div>
</div>

<script>
const SK='workout_v3', NK='notif_time';
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DS=['Pt','Sa','Ça','Pe','Cu','Ct','Pa'];
const DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MSGS=[
  {t:'💪 Antrenman Vakti!',b:'Seni seviyorum, hadi çalışma vakti.'},
  {t:'🌟 Hey Güzel!',b:'Aşkımm, bugün çalıştın mı? Hadi biraz çalışalım. Seni çok seviyorum.'},
  {t:'✨ Kontrol',b:"Çalıştın mı güzelim? 'Evet' cevabını duymak istiyorum."},
  {t:'💌 Mini Kontrol',b:'Mini kontrol: Bugün çalıştın mı sevgilim?'},
  {t:'🔥 Motivasyon',b:'Hatırlatma: Gelecekteki sen, bugünkü seni izliyor.'},
  {t:'😌 Uyarı',b:'Telefonu bırak, işe dön. (Bu mesaj hariç 😌)'}
];

let days={}, calYr=new Date().getFullYear(), notifTimer=null;
function toKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function todayKey(){return toKey(new Date());}
function load(){try{return JSON.parse(localStorage.getItem(SK)||'{}');}catch{return {};}}
function save(){localStorage.setItem(SK,JSON.stringify(days));}
function streak(){let s=0,t=new Date();for(let i=0;i<365;i++){let d=new Date(t);d.setDate(t.getDate()-i);if(days[toKey(d)])s++;else break;}return s;}

function toggleToday(){
  const k=todayKey();
  if(days[k])delete days[k]; else days[k]=true;
  save(); renderAll();
  const b=document.getElementById('star-btn');
  b.classList.add('pop');
  setTimeout(()=>b.classList.remove('pop'),500);
}

function renderAll(){
  const t=new Date(), done=!!days[todayKey()], s=streak(), total=Object.keys(days).length;
  document.getElementById('day-name').textContent=DN[t.getDay()];
  document.getElementById('date-text').textContent=`${t.getDate()} ${MONTHS[t.getMonth()]} ${t.getFullYear()}`;
  const card=document.getElementById('main-card');
  const btn=document.getElementById('star-btn');
  const poly=document.getElementById('star-poly');
  const st=document.getElementById('status-text');
  const ub=document.getElementById('undo-btn');
  card.className=done?'done':'';
  btn.className=done?'done':'';
  if(done){
    poly.setAttribute('fill','#C8956C');poly.setAttribute('stroke','#C8956C');poly.setAttribute('stroke-width','0');
    poly.style.filter='drop-shadow(0 0 8px rgba(200,149,108,0.6))';
    st.className='status-text done';st.textContent='Bugün harika iş çıkardın ✓';
    ub.className='visible';
  } else {
    poly.setAttribute('fill','none');poly.setAttribute('stroke','#D4B896');poly.setAttribute('stroke-width','2.2');
    poly.style.filter='none';
    st.className='status-text';st.textContent='Bugün antrenman yaptın mı?';
    ub.className='';
  }
  const sb=document.getElementById('streak-badge');
  if(s>0){sb.classList.remove('hidden');document.getElementById('streak-text').textContent=`${s} gün seri`;}
  else sb.classList.add('hidden');
  document.getElementById('total-count').innerHTML=total>0?`Toplam <strong>${total}</strong> antrenman`:'';
  renderWeek();
}

function renderWeek(){
  const bar=document.getElementById('week-bar'), t=new Date();
  bar.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(t);d.setDate(t.getDate()-6+i);
    const done=!!days[toKey(d)], isT=i===6, dow=(d.getDay()+6)%7;
    const c=document.createElement('div');
    c.className='day-cell'+(done?' done':'')+(isT?' today':'');
    c.innerHTML=`<span class="dc-label">${DS[dow]}</span>`+(done?`<svg width="14" height="14" viewBox="0 0 48 48"><polygon points="24,4 29.5,18.5 45,18.5 32.5,28 37,43 24,34 11,43 15.5,28 3,18.5 18.5,18.5" fill="#C8956C"/></svg>`:`<span class="dc-val">${d.getDate()}</span>`);
    bar.appendChild(c);
  }
}

function openCal(){calYr=new Date().getFullYear();renderCal();document.getElementById('cal-overlay').classList.add('open');}
function closeCal(){document.getElementById('cal-overlay').classList.remove('open');}
function chYear(d){calYr+=d;renderCal();}
function renderCal(){
  document.getElementById('cal-yr').textContent=calYr;
  const g=document.getElementById('year-grid');g.innerHTML='';
  const t=new Date();
  for(let mi=0;mi<12;mi++){
    const fd=new Date(calYr,mi,1), dim=new Date(calYr,mi+1,0).getDate();
    let sdow=fd.getDay()-1; if(sdow<0)sdow=6;
    const isCM=mi===t.getMonth()&&calYr===t.getFullYear();
    let h=DS.map(d=>`<div class="mmh">${d}</div>`).join('');
    for(let s=0;s<sdow;s++)h+=`<div class="mmc"></div>`;
    for(let day=1;day<=dim;day++){
      const k=toKey(new Date(calYr,mi,day)), dn=!!days[k];
      const it=isCM&&day===t.getDate();
      h+=`<div class="mmc${dn?' done':''}${it?' today':''}">${dn?'★':day}</div>`;
    }
    const m=document.createElement('div');m.className='month-mini';
    m.innerHTML=`<div class="month-mini-title">${MONTHS[mi]}</div><div class="mmg">${h}</div>`;
    g.appendChild(m);
  }
}

async function requestNotif(){
  const tv=document.getElementById('notif-time').value||'09:00';
  if(!('Notification' in window)){alert('Bu tarayıcı bildirim desteklemiyor.');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){
    localStorage.setItem(NK,tv);scheduleNotif(tv);
    document.getElementById('notif-banner').classList.remove('show');
    showToast('🔔 Bildirimler ayarlandı!');
  } else {
    alert('İzin verilmedi. Lütfen Safari ayarlarından bildirime izin ver.');
  }
}
function scheduleNotif(ts){
  if(notifTimer)clearTimeout(notifTimer);
  const[h,m]=ts.split(':').map(Number);
  const now=new Date(), next=new Date();
  next.setHours(h,m,0,0);
  if(next<=now)next.setDate(next.getDate()+1);
  notifTimer=setTimeout(()=>{fireNotif();scheduleNotif(ts);},next-now);
}
function fireNotif(){
  if(Notification.permission!=='granted'||days[todayKey()])return;
  const msg=MSGS[new Date().getDay()%MSGS.length];
  new Notification(msg.t,{body:msg.b,icon:'',tag:'antrenman'});
}

function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#6B4F3A;color:#FFF8EE;padding:10px 20px;border-radius:20px;font-size:13px;z-index:99;animation:slideUp 0.3s ease;white-space:nowrap;';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

// Init
days=load();renderAll();

// Notification setup
const savedT=localStorage.getItem(NK);
if(savedT)scheduleNotif(savedT);
else if(Notification.permission!=='granted')setTimeout(()=>document.getElementById('notif-banner').classList.add('show'),3000);

// iOS install hint
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone;
if(isIOS&&!isStandalone&&!localStorage.getItem('hint_shown')){
  setTimeout(()=>{document.getElementById('install-hint').classList.add('show');localStorage.setItem('hint_shown','1');},6000);
}

// Midnight refresh
(function mid(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);setTimeout(()=>{renderAll();mid();},m-n);})();

// Register inline SW
if('serviceWorker' in navigator){
  const sw=`
const MSGS=${JSON.stringify(MSGS)};
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>self.clients.claim());
self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));
self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(l=>l.length?l[0].focus():clients.openWindow('/')));});
  `;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
